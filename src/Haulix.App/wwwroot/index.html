<!doctype html>
<html lang="en" data-theme="dark" data-accent="amber">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAULIX</title>
  <meta name="description" content="HAULIX ETS2 Logger — offline telemetry and fleet intelligence for Euro Truck Simulator 2.">
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="stylesheet" href="vendor/uplot/uPlot.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/premium.css">
  <script src="vendor/uplot/uPlot.iife.min.js"></script>
</head>
<body>
  <div id="splash" class="splash" aria-live="polite">
    <div class="splash__glow splash__glow--a"></div>
    <div class="splash__glow splash__glow--b"></div>
    <div class="splash__inner">
      <div class="splash__logo">
        <svg class="splash__ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54"/><circle class="splash__ring-fill" id="splashRing" cx="60" cy="60" r="54" pathLength="100"/></svg>
        <img class="splash__mark" src="assets/brand/h-logo.png" alt="">
      </div>
      <div class="splash__brand">
        <div class="splash__name">HAULIX</div>
        <div class="splash__sub">ETS2 Logger</div>
      </div>
      <div class="splash__progress">
        <div class="splash__bar"><i id="splashFill"></i></div>
        <div class="splash__text" id="splashStep">Starting</div>
      </div>
    </div>
    <div class="splash__foot"><span id="splashVersion"></span><span>© 2026 RyanTMP</span></div>
  </div>
  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
